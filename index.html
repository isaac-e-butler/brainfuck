<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="keywords" content="brainfuck, brain, fuck, interpreter" />
        <meta name="author" content="Isaac Butler" />
        <meta name="description" content="A web-based interpreter for 'Brainfuck', an esoteric programming language." />

        <title>Brainf*ck</title>
        <link href="./src/style/index.css" type="text/css" rel="stylesheet" />
        <link href="./src/icons/favicon.svg" type="x-image/icon" rel="icon" />
        <script src="./src/scripts/index.js" type="module"></script>
    </head>
    <body>
        <div class="container">
            <div class="editor-container">
                <div class="editor-header">
                    <div class="editor-title"><h1>Brainf*ck</h1></div>
                    <div class="editor-menu-left" id="editor-options"></div>
                    <div class="editor-menu-top" id="runtime-options"></div>
                </div>
                <div id="editor" class="border"></div>
            </div>
            <div class="input-output-container">
                <div id="status" class="border console"><div id="status-content">status</div></div>
                <div id="output" class="border console"><div id="output-content">output</div></div>
                <form id="input-form">
                    <input
                        id="input"
                        name="input"
                        placeholder="input"
                        class="border-left-only"
                        title="Please enter a singular character - raw numbers can be escaped using '\'"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        disabled
                    />
                    <button id="input-submit" class="border-right-only" type="submit" disabled>
                        <img src="./src/icons/actions/keyboard-return.svg" />
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
